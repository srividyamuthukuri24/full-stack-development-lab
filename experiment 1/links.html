<!DOCTYPE html>
<html>
<head>
    <title>HTML Hyperlinks</title>
</head>

<body>

    <h1>HTML Hyperlinks</h1>

    <h2>1. Open in Same Tab</h2>

    <a href="https://www.google.com" target="_self">
        Open Google
    </a>


    <h2>2. Open in New Tab</h2>

    <a href="https://www.youtube.com" target="_blank">
        Open YouTube
    </a>


    <h2>3. Open GitHub</h2>

    <a href="https://github.com" target="_blank">
        Visit GitHub
    </a>


    <h2>4. Link to Another HTML Page</h2>

    <a href="../task-a-lists/lists.html" target="_self">
        View Lists Experiment
    </a>


    <h2>5. Email Link</h2>

    <a href="mailto:example@gmail.com">
        Send an Email
    </a>

</body>
</html>
